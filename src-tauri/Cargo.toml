[package]
name = "recipe-tool"
version = "0.1.0"
description = "Recipe suggestion prototype"
authors = ["Masato TOYOSHIMA <phoepsilonix@phoepsilonix.love>"]
edition = "2021"

[lib]
name = "recipe_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
