[package]
name = "kondate-tabi"
version = "0.1.0"
description = "こんだて旅: 具材と郷土料理から献立を探すプロトタイプ"
authors = ["Masato TOYOSHIMA <phoepsilonix@phoepsilonix.love>"]
edition = "2021"

[lib]
name = "kondate_tabi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
